<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint 1 · 学生端课表与课程大纲</title>
  <style>
    :root { color-scheme:light; --ink:#1c2a43; --sub:#63718a; --primary:#2956ce; --bg:#f2f5fa; --border:#dfe6f0; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,"Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#142b56; color:white; padding:22px max(24px,calc((100vw - 1140px)/2)); display:flex; align-items:center; justify-content:space-between; gap:14px; }
    header small { display:block; margin-bottom:5px; color:#b9cbe9; letter-spacing:1px; }
    header strong { font-size:21px; }
    .pill { border:1px solid #6d83ad; padding:6px 12px; border-radius:30px; color:#dbe6ff; font-size:12px; }
    main { max-width:1140px; margin:28px auto; padding:0 24px 40px; }
    .intro { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:24px; }
    h1 { margin:0 0 7px; font-size:25px; } .muted { color:var(--sub); font-size:14px; margin:0; }
    .controls { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
    select,button { font:inherit; border-radius:9px; padding:10px 12px; border:1px solid var(--border); background:white; color:var(--ink); }
    button { cursor:pointer; } button.primary { background:var(--primary); color:white; border-color:var(--primary); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:20px; }
    section { border-radius:16px; background:white; border:1px solid var(--border); box-shadow:0 8px 28px #1532510a; overflow:hidden; }
    .section-title { padding:21px 23px 14px; display:flex; align-items:center; justify-content:space-between; }
    h2 { margin:0; font-size:18px; } .count { color:var(--sub); font-size:12px; }
    .rows { padding:0 16px 16px; }
    .class-item,.course-item { margin:7px 0; padding:15px; border:1px solid #e7ecf5; border-radius:12px; background:#fafcff; }
    .class-item { display:flex; align-items:center; gap:14px; }
    .day { min-width:52px; background:#e9effe; color:#224db0; text-align:center; border-radius:9px; padding:9px 4px; font-weight:700; font-size:13px; }
    .grow { flex:1; min-width:0; } .rowtop { font-weight:700; margin-bottom:5px; }
    .rowmeta { font-size:12px; color:var(--sub); line-height:1.7; }
    .course-item { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .course-item button { white-space:nowrap; color:var(--primary); padding:8px 10px; }
    .course-item button:disabled { color:var(--sub); }
    .empty { padding:35px 10px; text-align:center; color:var(--sub); font-size:14px; }
    .note { margin-top:18px; color:var(--sub); font-size:12px; line-height:1.7; }
    #status { min-height:22px; margin-bottom:10px; color:#a73b20; font-size:13px; }
    dialog { border:0; padding:0; width:min(620px,calc(100vw - 32px)); border-radius:16px; box-shadow:0 20px 65px #142c4c55; }
    dialog::backdrop { background:#14223b80; } .modal-head { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border); }
    .modal-body { padding:22px 24px; } .modal-body h3 { font-size:13px; color:#254da6; margin:18px 0 8px; }
    .modal-body p { font-size:14px; line-height:1.7; margin:0; white-space:pre-wrap; }
    @media(max-width:800px) { .grid { grid-template-columns:1fr; } header { padding:20px 24px; } }
  </style>
</head>
<body>
  <header><div><small>SPRINT 1 · 教学管理系统</small><strong>学生学习中心</strong></div><span class="pill">功能原型 · 6A</span></header>
  <main>
    <div class="intro">
      <div><h1>我的课程与课表</h1><p class="muted">查看个人选修课程、每周课表与课程教学大纲</p></div>
      <div class="controls">
        <label for="student">演示身份</label>
        <select id="student"><option value="S2024001">学生甲 · S2024001</option><option value="S2024002">学生乙 · S2024002</option><option value="S2024003">学生丙 · S2024003（空课表）</option></select>
        <label for="week">教学周</label><select id="week"></select>
        <button class="primary" id="refresh">刷新</button>
      </div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="grid">
      <section><div class="section-title"><h2>本周课表</h2><span id="timetable-count" class="count"></span></div><div id="timetable" class="rows"></div></section>
      <section><div class="section-title"><h2>我的选修课程</h2><span id="course-count" class="count"></span></div><div id="courses" class="rows"></div></section>
    </div>
    <p class="note">演示说明：当前用 X-Demo-User 请求头切换预置学生身份，仅用于 Sprint 1 功能展示；正式上线需要接入真实登录鉴权。测试数据均为虚构。</p>
  </main>
  <dialog id="outline"><div class="modal-head"><h2 id="outline-title">课程大纲</h2><button id="close-dialog" aria-label="关闭">关闭</button></div><div id="outline-body" class="modal-body"></div></dialog>
  <script>
    const $ = id => document.getElementById(id);
    const weekSelect = $('week');
    for (let i = 1; i <= 20; i++) { const opt = document.createElement('option'); opt.value = i; opt.textContent = `第 ${i} 周`; weekSelect.append(opt); }
    weekSelect.value = '1';
    function make(tag, text, className) { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (className) el.className = className; return el; }
    function empty(parent, text) { parent.replaceChildren(make('div', text, 'empty')); }
    async function api(path) {
      const response = await fetch(path, { headers: { 'X-Demo-User': $('student').value } });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || `请求失败 (${response.status})`);
      return payload.data;
    }
    async function showOutline(courseId) {
      $('status').textContent = '';
      try {
        const data = await api(`/api/v1/students/me/courses/${encodeURIComponent(courseId)}/outline`);
        $('outline-title').textContent = `${data.course_name} · 教学大纲`;
        const body = $('outline-body'); body.replaceChildren();
        [['课程简介',data.summary], ['教学目标',data.objectives], ['章节安排',data.chapters], ['考核方式',data.assessment]]
          .forEach(([title,content]) => { body.append(make('h3', title),make('p',content)); });
        $('outline').showModal();
      } catch (e) { $('status').textContent = e.message; }
    }
    function renderTimetable(data) {
      const parent = $('timetable'); parent.replaceChildren(); $('timetable-count').textContent = `${data.total} 节课程安排`;
      if (!data.items.length) { empty(parent,'当前教学周没有课程安排'); return; }
      data.items.forEach(item => {
        const line = make('article',undefined,'class-item');
        const details = make('div',undefined,'grow');
        details.append(make('div',item.course_name,'rowtop'),make('div',`${item.start_section}–${item.end_section} 节 · ${item.classroom}`,'rowmeta'),make('div',`${item.teacher} · 第 ${item.start_week}–${item.end_week} 周`,'rowmeta'));
        line.append(make('div',item.weekday_name,'day'),details); parent.append(line);
      });
    }
    function renderCourses(data) {
      const parent = $('courses'); parent.replaceChildren(); $('course-count').textContent = `${data.total} 门课程`;
      if (!data.items.length) { empty(parent,'当前学生暂无选修课程'); return; }
      data.items.forEach(item => {
        const line = make('article',undefined,'course-item'),details=make('div',undefined,'grow');
        details.append(make('div',item.course_name,'rowtop'),make('div',`${item.course_id} · ${item.teacher} · ${item.credits} 学分`,'rowmeta'));
        const button = make('button',item.outline_published?'查看大纲':'大纲未发布');
        button.disabled = !item.outline_published;
        button.addEventListener('click',() => showOutline(item.course_id));
        line.append(details,button); parent.append(line);
      });
    }
    async function refresh() {
      $('status').textContent = '';
      const btn = $('refresh'); btn.disabled = true;
      try {
        const [schedule,courses] = await Promise.all([
          api(`/api/v1/students/me/timetable?week=${weekSelect.value}`), api('/api/v1/students/me/courses')
        ]);
        renderTimetable(schedule); renderCourses(courses);
      } catch(e) { $('status').textContent=e.message; }
      finally { btn.disabled = false; }
    }
    $('refresh').addEventListener('click',refresh);
    $('week').addEventListener('change',refresh);
    $('student').addEventListener('change',refresh);
    $('close-dialog').addEventListener('click',() => $('outline').close());
    refresh();
  </script>
</body>
</html>
