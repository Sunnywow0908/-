<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爱教学 · 教学督导中心</title>
<style>
:root{--ink:#1c2a43;--sub:#63718a;--primary:#2956ce;--bg:#f2f5fa;--border:#dfe6f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
header{background:#142b56;color:white;padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}header small{display:block;color:#b9cbe9;letter-spacing:1px;margin-bottom:5px}header strong{font-size:21px}header a{color:#dbe6ff;text-decoration:none;font-size:14px}main{max-width:1180px;margin:30px auto;padding:0 24px 50px}
.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}.intro h1{font-size:27px;margin:0 0 7px}.muted,.note{color:var(--sub);font-size:13px;line-height:1.7}.intro p{margin:0}.controls,.actionbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{font-size:13px;color:var(--sub)}
select,input,textarea,button{font:inherit;border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:white;color:var(--ink);min-height:42px}select{max-width:220px}button{cursor:pointer}button.primary{background:var(--primary);color:white;border-color:var(--primary)}button:hover{border-color:#9fb7ee}button:disabled{opacity:.45;cursor:not-allowed}
section,.metric{background:white;border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 28px #1532510a}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric{padding:19px 22px}.metric small{color:var(--sub)}.metric strong{display:block;color:var(--primary);font-size:28px;margin-top:8px}
section{padding:22px;margin-bottom:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h2{font-size:18px;margin:0}.count{font-size:13px;color:var(--sub)}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:14px;align-items:end}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-size:13px;color:var(--sub)}.field select,.field input{width:100%;max-width:none}.actionbar{margin-top:16px}.quick{border:0;background:#edf3ff;color:#2956ce;padding:8px 12px;min-height:34px}.quick.active{background:#2956ce;color:white}.quick-title{font-size:13px;color:var(--sub);margin-right:3px}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:14px 11px;text-align:left;border-bottom:1px solid #edf0f6;font-size:13px}th{background:#f8faff;color:var(--sub);font-size:12px}tr:hover td{background:#fbfcff}.tag{border-radius:15px;font-size:12px;padding:4px 9px;background:#fdf0e3;color:#9c5a12}.tag.yes{background:#e6f6ed;color:#1c7a46}.details{border:0;background:transparent;color:var(--primary);padding:4px;min-height:25px;font-size:13px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px;flex-wrap:wrap}.bottom button{padding:7px 13px;min-height:36px}.empty{padding:45px 15px;text-align:center;color:var(--sub);font-size:14px}#status{font-size:13px;color:#a73b20;margin-bottom:12px}#status:empty{display:none}
textarea{width:100%;min-height:120px;resize:vertical} .history-item{border:1px solid var(--border);padding:12px;border-radius:10px;margin:9px 0;background:#f8faff}.history-item small{color:var(--sub)} .inspect-form{border-top:1px solid var(--border);padding-top:16px;margin-top:18px} .inspect-form .field{margin:12px 0} .success{color:#1c7a46;font-size:13px}dialog{border:0;padding:0;width:min(600px,calc(100vw - 32px));border-radius:16px;box-shadow:0 20px 65px #142c4c55}dialog::backdrop{background:#14223b80}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--border)}.modal-body{padding:20px 24px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.info-grid small{display:block;color:var(--sub);margin-bottom:6px}
@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.filters,.metrics{grid-template-columns:1fr}main{padding:0 15px}header{padding:18px 15px}.intro{align-items:stretch}.controls{width:100%}}
</style></head><body>
<header><div><small>SPRINT 1 · 教学管理系统</small><strong>教学督导中心</strong></div><a href="/portal">四端工作台 ↗</a></header>
<main><div class="intro"><div><h1>课程开设情况</h1><p class="muted">掌握开课安排、授课教师、选课人数及教学大纲发布进度</p></div><div class="controls"><label for="identity">演示身份</label><select id="identity"><option value="V001">督导甲 · V001</option><option value="V002">督导乙 · V002</option></select><button class="primary" id="refresh">刷新数据</button></div></div>
<div class="metrics"><div class="metric"><small>开课教学班</small><strong id="offeringCount">—</strong></div><div class="metric"><small>涉及课程</small><strong id="courseCount">—</strong></div><div class="metric"><small>大纲已发布</small><strong id="publishedCount">—</strong></div><div class="metric"><small>大纲未发布</small><strong id="unpublishedCount">—</strong></div></div>
<section><div class="section-head"><h2>课程筛选</h2><span class="count">选择条件后点击查询，也可直接点击下方快捷筛选</span></div>
<div class="filters"><div class="field"><label for="semester">开课学期</label><select id="semester"><option value="">全部学期</option></select></div><div class="field"><label for="course">课程</label><select id="course"><option value="">全部课程</option></select></div><div class="field"><label for="outline">教学大纲状态</label><select id="outline"><option value="all">全部状态</option><option value="published">已发布</option><option value="unpublished">未发布</option></select></div><div class="field"><label for="keyword">关键词检索</label><input id="keyword" maxlength="80" placeholder="课程编号 / 名称 / 教学班"></div></div>
<div class="actionbar"><button class="primary" id="search">查询课程</button><button id="reset">重置条件</button><span class="quick-title">快捷查看：</span><button class="quick active" data-state="all">全部课程</button><button class="quick" data-state="published">大纲已发布</button><button class="quick" data-state="unpublished">大纲未发布</button></div></section>
<section><div class="section-head"><div><h2>开课明细 <span class="count" id="total"></span></h2></div><button id="export">导出当前筛选结果（CSV）</button></div><div id="status" role="status" aria-live="polite"></div><div class="tablewrap"><table><thead><tr><th>课程编号</th><th>课程名称</th><th>开课学期</th><th>教学班</th><th>任课教师</th><th>学分</th><th>选课人数</th><th>大纲状态</th><th>操作</th></tr></thead><tbody id="records"></tbody></table><div id="empty" class="empty" hidden>没有符合条件的开课记录，请调整筛选条件</div></div><div class="bottom"><span class="count" id="pagerText"></span><div><button id="prev">上一页</button> <button id="next">下一页</button></div></div></section><p class="note">数据由四端共享的课程数据库提供。当前身份切换仅供课堂演示，部署时须接入正式身份认证；课程资料的编辑与发布仍由对应业务角色负责。</p></main>
<dialog id="detail"><div class="modal-head"><h2>开课详情</h2><button id="close-detail" aria-label="关闭课程详情">关闭</button></div><div id="detail-body" class="modal-body"></div><div class="modal-body" style="padding-top:0"><h3 style="font-size:16px">督导检查记录</h3><div id="inspection-history" aria-live="polite">加载中…</div><form id="inspection-form" class="inspect-form"><h3 style="font-size:16px">新增检查意见</h3><div class="field"><label for="inspection-category">检查类型</label><select id="inspection-category" required><option>常规检查</option><option>教学进度</option><option>教学大纲</option><option>课堂教学</option><option>其他</option></select></div><div class="field"><label for="inspection-conclusion">检查结论</label><select id="inspection-conclusion" required><option>正常</option><option>需关注</option><option>待整改</option></select></div><div class="field"><label for="inspection-content">检查意见（5—1000字）</label><textarea id="inspection-content" minlength="5" maxlength="1000" required placeholder="请说明检查事实、发现的问题与改进建议"></textarea></div><div id="inspection-message" role="status" aria-live="polite"></div><button class="primary" id="inspection-submit" type="submit">保存检查意见</button></form></div></dialog>
<script>
const $=id=>document.getElementById(id);let page=1,pages=0,current=[],queryItems=[];
let selectedOffering=null;const columns=[['course_id','课程编号'],['course_name','课程名称'],['semester','开课学期'],['teaching_class','教学班'],['teachers','任课教师'],['credits','学分'],['enrolled_count','选课人数']];
function make(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(cls)el.className=cls;return el}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'X-Demo-User':$('identity').value,...(opts.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.message||`请求失败（${r.status}）`);return j.data}
function params(p=page,size=10){const keyword=[$('course').value,$('keyword').value.trim()].filter(Boolean).join(' ');return new URLSearchParams({keyword:keyword,semester:$('semester').value,outline_status:$('outline').value,page:String(p),page_size:String(size)})}
// 课程选项与关键词是两种互补的筛选方式；存在课程选择时使用课程编号精确过滤结果。
function requestParams(p=page,size=10){return new URLSearchParams({keyword:$('course').value||$('keyword').value.trim(),semester:$('semester').value,outline_status:$('outline').value,page:String(p),page_size:String(size)})}
async function loadOptions(){const data=await api('/api/v1/supervisors/me/offerings/filters');const oldSemester=$('semester').value,oldCourse=$('course').value;$('semester').replaceChildren(make('option','全部学期'));$('semester').firstChild.value='';for(const item of data.semesters){const opt=make('option',item);opt.value=item;$('semester').append(opt)}$('semester').value=data.semesters.includes(oldSemester)?oldSemester:(data.semesters[0]||'');$('course').replaceChildren(make('option','全部课程'));$('course').firstChild.value='';for(const c of data.courses){const opt=make('option',`${c.id} · ${c.name}`);opt.value=c.id;$('course').append(opt)}$('course').value=data.courses.some(c=>c.id===oldCourse)?oldCourse:''}
function filtersState(){document.querySelectorAll('.quick').forEach(b=>b.classList.toggle('active',b.dataset.state===$('outline').value))}
async function detail(item){const body=$('detail-body');body.replaceChildren();const grid=make('div',undefined,'info-grid');for(const [key,label] of [...columns,['outline_published','课程大纲']]){const box=make('div');box.append(make('small',label),make('strong',key==='outline_published'?(item[key]?'已发布':'未发布'):item[key]??'—'));grid.append(box)}body.append(grid);selectedOffering=item.offering_id;$('inspection-content').value='';$('inspection-message').textContent='';$('detail').showModal();await loadInspections()}
function render(d){pages=d.total_pages;current=d.items;for(const [id,key] of [['offeringCount','offerings'],['courseCount','courses'],['publishedCount','published'],['unpublishedCount','unpublished']])$(id).textContent=d.stats[key];$('total').textContent=`共 ${d.total} 条`;$('records').replaceChildren();for(const item of d.items){const tr=make('tr');for(const [key] of columns)tr.append(make('td',item[key]??'—'));const status=make('td');status.append(make('span',item.outline_published?'已发布':'未发布','tag'+(item.outline_published?' yes':'')));tr.append(status);const action=make('td'),btn=make('button','查看详情','details');btn.addEventListener('click',()=>detail(item));action.append(btn);tr.append(action);$('records').append(tr)}$('empty').hidden=d.items.length!==0;$('pagerText').textContent=`第 ${page} / ${Math.max(1,pages)} 页，每页10条`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('export').disabled=d.total===0}
async function load(){const status=$('status');status.textContent='正在加载…';$('search').disabled=true;try{const data=await api('/api/v1/supervisors/me/offerings?'+requestParams());render(data);status.textContent=''}catch(e){status.textContent=e.message;$('records').replaceChildren();$('empty').hidden=true;for(const id of ['offeringCount','courseCount','publishedCount','unpublishedCount'])$(id).textContent='—';$('total').textContent='';$('pagerText').textContent='';$('prev').disabled=$('next').disabled=$('export').disabled=true}finally{$('search').disabled=false}}
function search(){page=1;filtersState();load()}
$('search').onclick=search;$('refresh').onclick=async()=>{try{await loadOptions();search()}catch(e){$('status').textContent=e.message}};$('reset').onclick=()=>{$('course').value='';$('keyword').value='';$('outline').value='all';$('semester').selectedIndex=1<$('semester').options.length?1:0;search()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};$('identity').onchange=async()=>{try{await loadOptions();search()}catch(e){$('status').textContent=e.message}};$('outline').onchange=filtersState;$('keyword').onkeydown=e=>{if(e.key==='Enter')search()};$('course').onchange=()=>{$('keyword').value='';search()};$('semester').onchange=search;document.querySelectorAll('.quick').forEach(btn=>btn.onclick=()=>{$('outline').value=btn.dataset.state;search()});$('close-detail').onclick=()=>$('detail').close();
$('export').onclick=async()=>{const status=$('status');status.textContent='正在整理导出数据…';try{const all=[];const d=await api('/api/v1/supervisors/me/offerings?'+requestParams(1,100));all.push(...d.items);for(let p=2;p<=d.total_pages;p++){const result=await api('/api/v1/supervisors/me/offerings?'+requestParams(p,100));all.push(...result.items)}const header=[...columns.map(c=>c[1]),'大纲状态'];const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv='﻿'+[header,...all.map(item=>[...columns.map(c=>item[c[0]]),item.outline_published?'已发布':'未发布'])].map(r=>r.map(esc).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='课程开设情况.csv';a.click();URL.revokeObjectURL(url);status.textContent=''}catch(e){status.textContent='导出失败：'+e.message}};
async function loadInspections(){const host=$('inspection-history');host.textContent='正在加载检查记录…';try{const rows=await api(`/api/v1/supervisors/me/offerings/${selectedOffering}/inspections`);host.replaceChildren();if(!rows.length){host.append(make('p','暂无督导检查记录','muted'))}for(const row of rows){const item=make('div',undefined,'history-item');item.append(make('strong',`${row.category} · ${row.conclusion}`),make('p',row.content),make('small',`${row.supervisor_name} · ${row.created_at}`));host.append(item)}}catch(e){host.textContent='读取失败：'+e.message}}
$('inspection-form').onsubmit=async event=>{event.preventDefault();const msg=$('inspection-message'),btn=$('inspection-submit');btn.disabled=true;msg.textContent='正在保存…';try{await api(`/api/v1/supervisors/me/offerings/${selectedOffering}/inspections`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:$('inspection-category').value,conclusion:$('inspection-conclusion').value,content:$('inspection-content').value.trim()})});msg.textContent='检查意见已保存';msg.className='success';$('inspection-content').value='';await loadInspections()}catch(e){msg.textContent='保存失败：'+e.message;msg.className=''}finally{btn.disabled=false}};
loadOptions().then(search).catch(e=>{$('status').textContent=e.message});
</script></body></html>
